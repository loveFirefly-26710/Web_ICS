name: 镜像与部署

# push 到 main 或 master 时做两件事：
#
#   1. build-image：构建镜像推到 GHCR。这个 job 一直跑，不看服务器有没有配好 ——
#      「GHCR 里有一个可用的镜像」本身就是交付物，本地 docker compose pull 也要用它。
#   2. deploy：SSH 到服务器拉新镜像并重启。只有配好服务器才跑，受 DEPLOY_ENABLED 控制。
#
# 镜像在 CI 上构建、服务器只负责拉取，不在服务器上编译：目标机器是 2 核 1G，
# 跑 go build 会把它压垮，也会把部署拖到好几分钟。
#
# 配部署（可选，不配就只出镜像）：
#   在 Settings → Secrets and variables → Actions 的 Secrets 标签下加
#     DEPLOY_HOST     服务器地址
#     DEPLOY_USER     SSH 用户名
#     DEPLOY_SSH_KEY  私钥全文（含 BEGIN/END 行）
#   可选：
#     DEPLOY_PORT     SSH 端口，默认 22
#     DEPLOY_DIR      服务器上的 compose 目录，默认 /opt/web_ics
#   再把同一页面 Variables 标签下的 DEPLOY_ENABLED 设成 true，deploy 才会跑。
#   用 vars 而不是 secrets，是因为 secrets 在 job 级 if 里不可靠。
#
# 推镜像被拒是另一回事：那是 GHCR 的包级访问控制，改这个文件没用，
# 见下面「推送」那一步的错误提示。
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# 部署不能被打断，否则可能停在「镜像已换、容器没起」的中间态
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
  DEPLOY_DIR: ${{ secrets.DEPLOY_DIR || '/opt/web_ics' }}

jobs:
  build-image:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: 计算镜像名与版本标签
        id: meta
        # GHCR 的路径只接受小写，而 github.repository 会带上原始大小写，
        # 直接拼会 400。用 bash 的 ${var,,} 转小写。
        run: |
          img="ghcr.io/${GITHUB_REPOSITORY,,}"
          ver="v$(tr -d '[:space:]' < VERSION)"
          echo "image=$img" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "镜像 $img，版本标签 $ver"

      - name: 登录 GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: 构建
        # 三个标签：latest 给 compose 拉，版本号给固定版本用，sha 给追溯用。
        # 版本号取自仓库根目录的 VERSION 文件，与 release.yml 同一个来源。
        run: |
          docker build \
            -t "${{ steps.meta.outputs.image }}:latest" \
            -t "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}" \
            -t "${{ steps.meta.outputs.image }}:sha-${GITHUB_SHA::7}" \
            .

      - name: 推送
        # GHCR 的包级权限与仓库权限是两套。包已经存在、而本仓库不在它的
        # Manage Actions access 名单里时，这里会被拒，而 docker 自己的报错看不出该去哪改。
        run: |
          img="${{ steps.meta.outputs.image }}"
          if ! docker push --all-tags "$img"; then
            echo "::error::GHCR 拒绝写入。到该 package 的 Package settings → Manage Actions access，给本仓库授予 Write 权限，然后重跑这个 job。"
            exit 1
          fi

  deploy:
    name: 更新服务器
    needs: build-image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 只控制部署，不影响上面出镜像。没设 DEPLOY_ENABLED 时这个 job 显示为「跳过」
    # （灰色），而不是每次 push 都因为缺 secrets 报红。服务器准备好之后再打开。
    # 用 vars 而不是 secrets：secrets 在 job 级 if 里不可靠。
    if: vars.DEPLOY_ENABLED == 'true'
    steps:
      - name: 检查部署凭据
        run: |
          missing=""
          [ -n "${{ secrets.DEPLOY_HOST }}" ] || missing="$missing DEPLOY_HOST"
          [ -n "${{ secrets.DEPLOY_USER }}" ] || missing="$missing DEPLOY_USER"
          [ -n "${{ secrets.DEPLOY_SSH_KEY }}" ] || missing="$missing DEPLOY_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::缺 secrets:$missing。在 Settings → Secrets and variables → Actions 里补上，或者把 DEPLOY_ENABLED 关掉。"
            exit 1
          fi

      - name: 准备密钥
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # 首次连接要写 known_hosts，否则 StrictHostKeyChecking 会把连接拦下。
          # 想更严一点就把服务器指纹存成 secret，别用 ssh-keyscan。
          ssh-keyscan -p "$DEPLOY_PORT" -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: 拉取新镜像并重启
        run: |
          ssh -i ~/.ssh/id_deploy -p "$DEPLOY_PORT" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "set -e
             cd '$DEPLOY_DIR'
             docker compose pull web_ics
             docker compose up -d web_ics
             sleep 3
             docker compose ps web_ics
             curl -fsS http://127.0.0.1:8080/healthz || true"
