name: Release

# 推 master 就发版，不用另外打标签：
#
#   改代码 -> commit -> push -> 这里跑一遍，Release v<VERSION> 里的产物换成最新的
#   要出新版本 -> 改根目录 VERSION 文件里的数字 -> push -> 多一个 Release
#
# 版本号只有一个来源，就是仓库根目录的 VERSION 文件。这样不会出现「手敲构建命令时
# 忘了改 ldflags，产物版本与 VERSION 对不上」的情况。
#
# 推 v* 标签时按标签名发版，手动触发也留着，作为备用。
#
# 一次产出两个文件：
#   web_ics.exe               Windows 免安装单文件
#   web_ics-linux-amd64       Linux 免安装单文件
#
# 只用一个 job：build.sh 本来就会同时交叉编译两个平台，拆成两个 job 会变成两套
# 构建路径，早晚漂移。
#
# 留在 windows runner 上是为了冒烟：只有 Windows 能真的执行 web_ics.exe，
# ubuntu 上跑不了 .exe，Windows 产物就只能靠「编译通过」来保证。代价是比
# ubuntu runner 贵。
on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

# 创建 Release 需要写权限，其余一律只读
permissions:
  contents: write

# 现在推分支也会发版，连着推两次就可能撞在同一个标签上。发版不能被打断，
# 否则会停在「产物传了一半」的中间态。
concurrency:
  group: release
  cancel-in-progress: false

env:
  # build.sh 只在环境变量为空时才设默认值，而它的默认值是 goproxy.cn（给国内网络
  # 准备的），runner 在境外。这里显式给一个，让脚本不要走那个分支。
  GOPROXY: https://proxy.golang.org,direct

jobs:
  release:
    name: 构建并发布
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # Release 正文要列「上一个 tag 到本次」的提交，浅克隆拿不到历史
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      # 标签推送用标签名，其余情况用 VERSION 文件里的数字，最后都归到一个标签名
      - name: 算出要发布的标签与版本号
        id: ver
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v$(tr -d '[:space:]' < VERSION)"
          fi
          VER="${TAG#v}"
          if [ -z "$VER" ]; then
            echo "::error::解析不出版本号，检查 VERSION 文件或标签名"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "本次发布 $TAG，版本号 $VER"

      - name: 构建（复用 build.sh）
        # 复用脚本而不是另写 go build：本地出包与 CI 出包必须是同一条路径，
        # 而且 build.sh 里还有 gofmt、vet 和「构建机路径不得进二进制」的核对。
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: bash ./build.sh

      - name: 冒烟并核对版本号已注入
        shell: pwsh
        run: |
          $out = ./dist/web_ics.exe --version
          Write-Host $out
          if ($out -notmatch [regex]::Escape("${{ steps.ver.outputs.version }}")) {
            throw "版本号没注入进二进制：$out"
          }

      - name: 上传产物（Actions 页面留存）
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            dist/web_ics.exe
            dist/web_ics-linux-amd64
          if-no-files-found: error

      - name: 写 Release 正文
        # 正文自己拼，不用 gh 的 --generate-notes：它给不出「下哪个文件、怎么用」，
        # 而且首个版本没有上一个 tag 可比，只会输出一行 Full Changelog。
        shell: bash
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          # 推分支时标签还没建（那是后面 gh release create 建的），不能直接拿 $TAG
          # 当 revision，否则 git log 会报 unknown revision，这一步直接失败。
          if git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            tip="${TAG}"
          else
            tip="HEAD"
          fi

          prev="$(git describe --tags --abbrev=0 --match 'v*' "${tip}^" 2>/dev/null || true)"
          if [ -n "$prev" ]; then
            range="${prev}..${tip}"
            echo "上一个版本: $prev"
          else
            range="${tip}"
            echo "这是第一个版本"
          fi

          {
            echo "两个产物都是自包含的，前端资源编译在里面，不需要任何运行时。"
            echo
            echo "| 文件 | 平台 | 怎么用 |"
            echo "|---|---|---|"
            echo '| `web_ics.exe` | Windows x64 | 拷到任意目录双击 |'
            echo '| `web_ics-linux-amd64` | Linux x86-64 | `chmod +x` 后直接运行 |'
            echo
            echo "首次启动会在后台建正文语料（59 个包约 4 分钟），这期间正文搜不到东西，标题能搜。"
            echo "用法与部署见仓库的 README。"
            echo
            echo "## 本版提交"
            echo
            git log --no-merges --pretty='- %s' "$range"
          } > "$RUNNER_TEMP/notes.md"

      - name: 保证标签在远端指向本次构建的提交
        # gh release create 会先确认标签在不在远端，不在就报「exists locally but has
        # not been pushed」并退出。推分支时标签本来就还没建；上一次运行建过的标签，
        # 还可能指向被强推掉的旧提交。所以这里自己把它对齐到本次提交，
        # 不去猜 gh 的判断依据。
        shell: bash
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          git tag -f "$TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/$TAG"

      - name: 发布 Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          # 同一个版本又推了一次时不重建 Release，只把里面的产物换掉，
          # 否则第二次会报「Release already exists」。想发新版就改 VERSION 文件。
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，只替换产物"
            gh release upload "$TAG" \
              dist/web_ics.exe \
              dist/web_ics-linux-amd64 \
              --clobber
          else
            extra=""
            # 带连字符的 tag 视为预发布，例如 v0.2.0-rc1
            case "$TAG" in *-*) extra="--prerelease" ;; esac
            gh release create "$TAG" \
              --title "Web_ICS ${TAG#v}" \
              --target "$GITHUB_SHA" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              $extra \
              dist/web_ics.exe \
              dist/web_ics-linux-amd64
          fi
